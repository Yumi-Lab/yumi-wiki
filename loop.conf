# ============================================================================
#  Autonomous Loop Kit — configuration (optionnelle)
#  Fichier sourcé par loop.sh. SANS ce fichier (ou avec reviewer=false), loop.sh
#  tourne en CODEUSE SEULE (comportement historique). Édite-le pour activer le
#  MODE CONTRÔLÉ (alternance codeuse ⇄ contrôleuse).
#  Format : shell key=value (clés = identifiants ; commentaires en français).
# ============================================================================

# --- Rôles ------------------------------------------------------------------
# Chaque itération lance CODEUSE puis (si activée) CONTRÔLEUSE.
#   coder    : l'agent qui code — prend la prochaine case, implémente, teste, commit.
#   reviewer : le contrôle qualité — revue READ-ONLY du dernier commit → verdict
#              (.loop/control/last-verdict.json + .loop/control/log.md). Ne commit rien.
# Valeurs booléennes : true / false (aussi 1/0, yes/no, on/off).
coder=true
reviewer=true               # revue avant d'avancer — repo wiki en prod, on gate chaque lot

# --- Modèle PAR type d'instance (vide = défaut du CLI) ----------------------
# Le modèle route vers le bon CLI dans run_agent() (multi-provider, INSENSIBLE À LA CASSE) :
#   opus | sonnet | haiku | fable | <id complet> | (vide)  → CLI `claude`
#     Opus 5 est dispo EN PARALLÈLE d'Opus 4.8 (même tarif $5/$25, buckets de rate-limit SÉPARÉS) :
#     'opus' = alias CLI (→ Opus 5) · épingler : opus-5 / opus-4.8 / sonnet-5 (→ ids complets).
#     Mix par instance conseillé : coder_model=opus-5 + reviewer_model=opus-4.8 = double headroom.
#   yumi:<modèle> (ex. yumi:sonnet) | yumi                  → CLI `yumi` (clone Go iso Claude Code :
#                                                             mêmes flags/quota, ~10x moins de RAM)
#   kimi:<modèle> (ex. kimi:k3-256k) | kimi                  → CLI Kimi Code. Alias & usage :
#       k3-256k → qualité K3 (flagship 2.8T) en 256k, conso réduite = RECOMMANDÉ pour les BOUCLES
#                 (contexte neuf à chaque tour : le 1M ne sert qu'à une revue consolidée géante)
#       k3      → K3 fenêtre 1M (1M selon palier) · k2.7 → K2.7 tout-venant (tous paliers)
#       (highspeed existe mais NE JAMAIS le choisir par défaut : 3x LE QUOTA pour de la vitesse —
#        une boucle fait du travail LONG, pas de la course ; réservé à une demande EXPLICITE.)
#       ou clé complète du registre config.toml — namespace ACTUEL kimi-code/* (les vieilles clés
#       kimi-for-coding/* sont remappées). Doc : kimi.com/code/docs/en/kimi-code/models
#   grok                                                     → CLI Grok (xAI)
#   mistral | vibe | devstral | mistral-local               → CLI Mistral Vibe
# Tu peux mélanger (ex. coder_model=yumi:sonnet + reviewer_model=yumi:haiku, ou kimi + opus).
coder_model=kimi:k3-256k    # flagship K3, fenêtre 256k (contexte neuf par tour : le 1M est du gâchis)
reviewer_model=kimi:k2.7    # contrôleuse moins chère, suffisant pour une revue read-only

# --- Multi-provider : binaires/paramètres (optionnels, défauts sensés) -------
# Renseigne uniquement si tu utilises kimi/grok/mistral, ou pour surcharger un défaut.
kimi_bin=                   # défaut : $HOME/.kimi-code/bin/kimi
kimi_model=                # -m global passé à kimi (vide = défaut du CLI ; kimi:<modèle> par
                           # instance est prioritaire ; alias : k2.7 / k3 / k3-256k / highspeed)
grok_bin=                  # défaut : `grok` du PATH, sinon $HOME/.local/bin/grok
grok_model=                # -m passé à grok (vide = défaut du CLI grok)
vibe_bin=                  # défaut : `vibe` du PATH, sinon $HOME/.local/bin/vibe
vibe_model=                # override VIBE_ACTIVE_MODEL (vide = auto selon le mot-clé)
vibe_max_price=            # --max-price (plafond $ Vibe ; vide = pas de plafond)
yumi_bin=                  # défaut : `yumi` du PATH, sinon $HOME/.local/bin/yumi
                           # (build : cd yumi-cli && go build -ldflags="-s -w" -o ~/.local/bin/yumi ./cmd/yumi)
allowed_tools=             # (claude) si défini → --allowedTools au lieu de --dangerously-skip-permissions
# Provider CUSTOM (OpenAI-compatible : Qwen/Ollama/gateway…) sans toucher loop.sh : définis une
# fonction shell run_custom ci-dessous ; elle lit AGENT_PROMPT/AGENT_MODEL/AGENT_TURNS et doit sortir
# du JSON en streaming (style Claude ou OpenAI ; fmt() gère les deux). Ex :
#   run_custom() { mon-cli --model "$AGENT_MODEL" -p "$AGENT_PROMPT" --stream-json; }

# --- Gate-handoff (cède la main pour un contrôle visuel/device) -------------
# Quand la DoD impose un gate navigateur/appareil que la boucle ne peut pas faire seule, la
# codeuse écrit handoff_file (URL + checklist) et la boucle STOP → tu fais le gate à la main,
# puis tu supprimes le fichier pour relancer. gate_handoff=false désactive tout le mécanisme.
gate_handoff=true
handoff_file=.gate-handoff

# --- Déploiement live (optionnel, GÉNÉRIQUE) --------------------------------
# Si deploy_cmd est renseigné, la codeuse DÉPLOIE après TEST vert (étape GATE du cycle) puis
# gate le live. Reste 100% générique : c'est TA commande. Vide = mode local pur (défaut).
deploy_cmd=                # ex. "docker compose up -d --build api web" ou "./deploy.sh"
health_url=                # ex. "https://ton-app/health" — gate HTTP 200 après deploy

# --- Limites & garde-fous anti-runaway --------------------------------------
max_iters=120               # ~25 lots, mode contrôlé (chaque lot = 1 tour codeuse + 1 tour contrôleuse mini)
coder_max_turns=80
reviewer_max_turns=120      # une revue CONSOLIDÉE multi-lots (rattrapage après incident) dépasse largement 40 tours ;
                            # une contrôleuse tuée en max-turns AVANT d'écrire = verdict périmé (voir max_review_retry)
max_fails=3                 # échecs provider consécutifs (binaire/modèle/token) → abandon
max_stale=4                 # itérations SANS nouveau commit git → arrêt (agent bloqué)
max_cr=3                    # verdicts CHANGES_REQUESTED d'affilée sur le même HEAD → arrêt (ping-pong)
max_review_retry=3          # revues consécutives SANS verdict frais (contrôleuse morte avant d'écrire / JSON
                            # illisible) → arrêt. Entre-temps : fail-closed CHANGES_REQUESTED synthétique,
                            # codeuse sautée, la contrôleuse est relancée directement sur la même plage.
auto_update=true            # la boucle active ELLE-MÊME un loop.sh.new déposé par sync-kit, à la frontière
                            # d'itération (bascule à chaud : même PID/verrou, compteurs et jsonl conservés).
                            # false pour les forks à merge manuel ou pour geler la version pendant un run.
fallback_models=            # FAILOVER crédit/panne (vide = off) : modèles de secours essayés EN ROTATION
                            # quand le provider de la codeuse échoue max_fails fois (ex. "grok mistral
                            # kimi:k2.7"). La contrôleuse suit si elle partage le provider en panne. La
                            # boucle SONDE ensuite le modèle primaire (1 tour minimal) et lui REND la main
                            # dès qu'il répond. Arrêt seulement après 2 tours complets de liste sans succès.
probe_every=3               # en failover : cadence (itérations) de la sonde du modèle primaire
inject_warn_lines=120       # hygiène de contexte : .loop/inject.md au-delà → avertissement console +
                            # consigne d'archivage injectée à la codeuse (→ .loop/inject-archive.md,
                            # le canal ne garde que l'ACTIONNABLE)
progress_warn_bytes=153600  # idem PROGRESS.md (déf. 150 Ko) : archiver le vieux Journal →
                            # PROGRESS-archive.md (toutes les cases + ~10 dernières entrées restent).
                            # Ces 2 fichiers sont relus ENTIERS par les DEUX agents à CHAQUE tour :
                            # trop gros = tours épuisés en lecture (vécu : 266 lignes + 213 Ko)
max_cost=                   # plafond de coût $ cumulé (jq requis ; télémétrie claude uniquement) ; vide = pas de plafond
# Hook de fin (eval'd ; voit $LOOP_STATE / $LOOP_ITERS). METS LA VALEUR ENTRE QUOTES SIMPLES (espaces +
# $VAR développés à la fin, pas au chargement). ex. notify_cmd='curl -s -d "loop $LOOP_STATE" https://hook…'
notify_cmd=

# --- Gate mécanique (optionnel) ---------------------------------------------
# Un script exécutable `verify.sh` à la racine du projet, s'il existe, est lancé APRÈS chaque codeuse :
# s'il échoue (rouge), la consigne « corrige d'abord » est injectée au tour suivant et .done est refusé.
# 100% générique — c'est TON script (pytest/tsc/lint/build/curl…). Rien à configurer ici.

# --- Attribution boucle → agent (owner — God Mode / supervision) -------------
# L'AGENT qui arme la boucle exporte LOOP_OWNER_ID (identité gateway OPAQUE, copiée verbatim, jamais
# dérivée localement) + optionnels LOOP_OWNER_LABEL (affichage) / LOOP_OWNER_SOURCE / LOOP_OWNER_CONTEXT
# (contextId A2A) AVANT ./loop.sh → loop.sh écrit le miroir local .monitor/owner.json (atomique),
# affiché par le hub (chip « 👤 » + « lancé par X : N boucles », présent dans /api/loops).
# Alternative compatible avec TOUT loop.sh : l'agent écrit lui-même .monitor/owner.json (tmp + mv).
# Env absent = fichier INTACT (les relances watchdog/remote ne l'effacent jamais) : owner = qui a ARMÉ.

# --- Prompts (fichiers de rôle ; repli sur prompts intégrés si absents) -----
coder_prompt=prompts/coder.md
reviewer_prompt=prompts/reviewer.md
